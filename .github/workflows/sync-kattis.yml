name: Sync Kattis Solutions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kattis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install autokattis
        run: pip install --upgrade autokattis

      - name: Fetch Open Kattis solved problems
        env:
          KATTIS_USERNAME: ${{ secrets.KATTIS_USERNAME }}
          KATTIS_PASSWORD: ${{ secrets.KATTIS_PASSWORD }}
        run: python3 scripts/fetch_kattis.py --output data/kattis-solutions.json > /dev/null

      - name: Check for solution changes
        id: check_changes
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          new_path = Path("data/kattis-solutions.json")
          new_data = json.loads(new_path.read_text(encoding="utf-8"))

          try:
              old_raw = subprocess.check_output(
                  ["git", "show", "HEAD:data/kattis-solutions.json"],
                  stderr=subprocess.DEVNULL,
                  text=True,
              )
              old_data = json.loads(old_raw)
          except Exception:
              old_data = None

          def strip_ts(obj):
              if not isinstance(obj, dict):
                  return None
              return {k: v for k, v in obj.items() if k != "fetchedAt"}

          other_data_changes = subprocess.check_output(
              ["git", "status", "--porcelain", "--", "data/", ":!data/kattis-solutions.json"],
              text=True,
          ).strip()

          changed = strip_ts(new_data) != strip_ts(old_data) or bool(other_data_changes)
          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
          PY

      - name: Commit and push updated solutions
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: sync Kattis solutions"
          git push origin main
